# Pre-commit configuration for Genrl-downloader
# See https://pre-commit.com for more information
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust format check
        entry: cargo fmt --manifest-path core/Cargo.toml --all -- --check
        language: system
        pass_filenames: false

      - id: dart-format
        name: Dart format check
        entry: dart format --output=none --set-exit-if-changed app/
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: Cargo clippy (zero warnings)
        entry: cargo clippy --manifest-path core/Cargo.toml --workspace -- -D warnings
        language: system
        pass_filenames: false

      - id: flutter-analyze
        name: Flutter analyze
        entry: bash -c "cd app && flutter analyze"
        language: system
        pass_filenames: false

      - id: check-caps
        name: File size hard cap check (<= 500 lines)
        entry: python3 tools/check_caps.py
        language: system
        pass_filenames: false

      - id: contract-check
        name: Core/UI contract synchronization check
        entry: python3 tools/generate_contract.py --check
        language: system
        pass_filenames: false

      - id: theme-check
        name: Design token synchronization check
        entry: python3 tools/generate_theme.py --check
        language: system
        pass_filenames: false

      - id: rust-tests
        name: Rust test suite
        entry: cargo test --manifest-path core/Cargo.toml --workspace
        language: system
        pass_filenames: false

      - id: flutter-tests
        name: Flutter test suite (including goldens)
        entry: bash -c "cd app && flutter test"
        language: system
        pass_filenames: false
