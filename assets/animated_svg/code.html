<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_24 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_24" style="display:block;"><svg height="240" viewbox="0 0 240 240" width="240" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="violetGlow" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#a78bfa" stop-opacity="1"></stop>
<stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"></stop>
</lineargradient>
<lineargradient id="cyanAccent" x1="0%" x2="100%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"></stop>
<stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"></stop>
</lineargradient>
<filter height="160%" id="neonBlur" width="160%" x="-30%" y="-30%">
<fegaussianblur result="blur" stddeviation="5"></fegaussianblur>
<femerge>
<femergenode in="blur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
</defs>
<style>
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #8b5cf6); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }
    @keyframes bitPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .ring-outer {
      transform-origin: 120px 120px;
      animation: spinClockwise 6s linear infinite;
    }
    .ring-middle {
      transform-origin: 120px 120px;
      animation: spinCounter 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .ring-inner {
      transform-origin: 120px 120px;
      animation: spinClockwise 2.2s linear infinite;
      stroke-dasharray: 40 80 15 40;
    }
    .core-node {
      transform-origin: 120px 120px;
      animation: pulseCore 2.4s ease-in-out infinite;
    }
    .data-stream {
      stroke-dasharray: 8 16;
      animation: dashStream 3s linear infinite;
    }
    .orbital-dot-1 {
      transform-origin: 120px 120px;
      animation: spinClockwise 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .orbital-dot-2 {
      transform-origin: 120px 120px;
      animation: spinCounter 2.5s ease-in-out infinite;
    }
  </style>
<!-- Background Ambient Glow -->
<circle cx="120" cy="120" fill="#8b5cf6" filter="url(#neonBlur)" opacity="0.06" r="80"></circle>
<!-- Outer Technical Tick Track -->
<circle cx="120" cy="120" fill="none" opacity="0.6" r="102" stroke="#252b36" stroke-dasharray="2 10" stroke-width="2"></circle>
<!-- Outer Dynamic Segment Ring -->
<g class="ring-outer">
<circle cx="120" cy="120" fill="none" filter="url(#neonBlur)" r="95" stroke="url(#violetGlow)" stroke-dasharray="140 180" stroke-linecap="round" stroke-width="3"></circle>
<circle cx="120" cy="120" fill="none" r="95" stroke="#a78bfa" stroke-dasharray="25 350" stroke-linecap="round" stroke-width="4"></circle>
</g>
<!-- Mid Radar Stream -->
<g class="ring-middle">
<circle cx="120" cy="120" fill="none" filter="url(#neonBlur)" r="76" stroke="url(#cyanAccent)" stroke-dasharray="80 160 30 90" stroke-linecap="round" stroke-width="3.5"></circle>
<!-- Mini Radar Satellites -->
<circle cx="120" cy="44" fill="#06b6d4" r="3.5"></circle>
<circle cx="120" cy="196" fill="#8b5cf6" r="2.5"></circle>
</g>
<!-- Inner High-Speed Ring -->
<g class="ring-inner">
<circle cx="120" cy="120" fill="none" opacity="0.85" r="54" stroke="#c4b5fd" stroke-linecap="round" stroke-width="2.5"></circle>
</g>
<!-- Orbiting Download Data Nodes -->
<g class="orbital-dot-1">
<circle cx="120" cy="25" fill="#a78bfa" filter="url(#neonBlur)" r="4"></circle>
<line opacity="0.7" stroke="#a78bfa" stroke-width="1.5" x1="120" x2="120" y1="25" y2="35"></line>
</g>
<g class="orbital-dot-2">
<circle cx="178" cy="120" fill="#38bdf8" r="3"></circle>
</g>
<!-- Core Downloader Emblem / Packet Receiver -->
<g class="core-node">
<!-- Hexagonal or Diamond Core Background -->
<rect fill="#181c24" height="44" rx="12" stroke="#8b5cf6" stroke-width="2" transform="rotate(45 120 120)" width="44" x="98" y="98"></rect>
<!-- Central Download Arrow & Ingestion Pulses -->
<path d="M120 106 V127 M113 121 L120 128 L127 121" fill="none" stroke="#f1f5f9" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
<line stroke="#8b5cf6" stroke-linecap="round" stroke-width="2.5" x1="110" x2="130" y1="134" y2="134"></line>
</g>
<!-- Hexagon Data Dots -->
<circle cx="95" cy="95" fill="#a78bfa" opacity="0.7" r="1.5"></circle>
<circle cx="145" cy="95" fill="#a78bfa" opacity="0.7" r="1.5"></circle>
<circle cx="95" cy="145" fill="#a78bfa" opacity="0.7" r="1.5"></circle>
<circle cx="145" cy="145" fill="#a78bfa" opacity="0.7" r="1.5"></circle>
</svg></div><!-- STITCH_SVG_END:ANIMATION_24 -->
</body>
</html>
