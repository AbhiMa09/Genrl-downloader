name: CI

on:
  push:
    branches: [ main, ci-check, windows ]
  pull_request:
    branches: [ main, ci-check, windows ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-guardrails:
    name: Lint, Formatting & Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Check Rust formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: Check Flutter formatting
        run: dart format --output=none --set-exit-if-changed app/

      - name: Run Cargo Clippy (zero warnings)
        run: cargo clippy --manifest-path core/Cargo.toml --workspace -- -D warnings

      - name: Run Flutter Analyzer (strict)
        run: |
          cd app
          flutter analyze

      - name: Guardrail - File size cap (<= 500 lines)
        run: python3 tools/check_caps.py

      - name: Guardrail - Contract synchronization check
        run: python3 tools/generate_contract.py --check

      - name: Guardrail - Theme tokens synchronization check
        run: python3 tools/generate_theme.py --check

  test-rust:
    name: Rust Test Suite (Core & CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Cargo Tests (Unit, Integration, Snapshots, Proptests)
        run: cargo test --manifest-path core/Cargo.toml --workspace

  test-flutter:
    name: Flutter Test Suite (Unit & Goldens)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Run Flutter Tests (CI-safe Unit & Widget)
        run: |
          cd app
          flutter test --exclude-tags golden

      - name: Run Flutter Golden Tests (Visual Regression, Non-blocking in CI)
        continue-on-error: true
        run: |
          cd app
          flutter test --tags golden

  test-windows:
    name: Windows Test Suite & Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Windows Cargo Tests
        run: cargo test --manifest-path core/Cargo.toml --workspace

      - name: Install Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Run Windows Flutter Tests
        run: |
          cd app
          flutter test --exclude-tags golden

      - name: Build genrl.exe Core Binary
        run: cargo build --manifest-path core/Cargo.toml --release --bin genrl

      - name: Build Flutter Windows Desktop Runner
        run: |
          cd app
          flutter build windows --release

      - name: Bundle genrl.exe with Flutter runner
        shell: pwsh
        run: |
          $candidates = @("core/target/release/genrl.exe", "core/target/x86_64-pc-windows-msvc/release/genrl.exe")
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
              $src = (Get-ChildItem -Path "core/target" -Filter "genrl.exe" -Recurse | Where-Object { $_.FullName -match "release" } | Select-Object -First 1).FullName
          }
          $runnerDir = (Resolve-Path "app/build/windows/*/runner/Release" | Select-Object -First 1).Path
          Copy-Item $src -Destination "$runnerDir/genrl.exe"
          Write-Host "Bundled $src into $runnerDir"
          Get-ChildItem -Path $runnerDir

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genrl-windows-x64
          path: app/build/windows/*/runner/Release/
          if-no-files-found: error
