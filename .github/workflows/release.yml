name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build genrl Core Binary
        run: cargo build --manifest-path core/Cargo.toml --release --bin genrl

      - name: Build Flutter Linux Desktop App
        run: |
          cd app
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Package Linux Bundle
        run: |
          cp core/target/release/genrl app/build/linux/x64/release/bundle/genrl
          chmod +x app/build/linux/x64/release/bundle/genrl
          mkdir -p dist
          tar -czf dist/genrl-downloader-linux-x64.tar.gz -C app/build/linux/x64/release bundle

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/genrl-downloader-linux-x64.tar.gz

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build genrl.exe Core Binary
        run: cargo build --manifest-path core/Cargo.toml --release --bin genrl

      - name: Build Flutter Windows Desktop Runner
        run: |
          cd app
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get
          flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          $candidates = @("core/target/release/genrl.exe", "core/target/x86_64-pc-windows-msvc/release/genrl.exe")
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
              $src = (Get-ChildItem -Path "core/target" -Filter "genrl.exe" -Recurse | Where-Object { $_.FullName -match "release" } | Select-Object -First 1).FullName
          }
          $runnerDir = (Resolve-Path "app/build/windows/*/runner/Release" | Select-Object -First 1).Path
          Copy-Item $src -Destination "$runnerDir/genrl.exe"
          mkdir dist
          Compress-Archive -Path "$runnerDir/*" -DestinationPath "dist/genrl-downloader-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/genrl-downloader-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
